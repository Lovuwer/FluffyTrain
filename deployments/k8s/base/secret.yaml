apiVersion: v1
kind: Secret
metadata:
  name: titan-secrets
  labels:
    app.kubernetes.io/name: titan
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these with actual secrets before deploying!
