apiVersion: apps/v1
kind: Deployment
metadata:
  name: titan-api
  labels:
    app.kubernetes.io/name: titan
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: titan-api
  template:
    metadata:
      labels:
        app: titan-api
        app.kubernetes.io/name: titan
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: titan-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: titan-config
            - secretRef:
                name: titan-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: titan-api
                topologyKey: kubernetes.io/hostname
