# Titan Redis Configuration
# =========================
# Custom Redis configuration for the Titan job queue system.
# This configuration enables persistence and sets memory limits.

# Network binding
bind 0.0.0.0

# Port (default 6379)
port 6379

# Persistence Settings
# --------------------
# Enable AOF (Append Only File) persistence for durability
appendonly yes

# AOF fsync policy
# - always: fsync after every write (slowest, safest)
# - everysec: fsync once per second (good balance)
# - no: let OS decide (fastest, least safe)
appendfsync everysec

# AOF rewrite configuration
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots (in addition to AOF)
# Save after 900 seconds if at least 1 key changed
# Save after 300 seconds if at least 10 keys changed
# Save after 60 seconds if at least 10000 keys changed
save 900 1
save 300 10
save 60 10000

# Memory Management
# -----------------
# Maximum memory limit (adjust based on your needs)
maxmemory 200mb

# Eviction policy when maxmemory is reached
# noeviction: return error on write when memory is full
# This is safest for a job queue where we don't want to lose jobs
maxmemory-policy noeviction

# Logging
# -------
loglevel notice

# Security
# --------
# Protected mode (disable if using password or bind)
protected-mode no

# Timeout for idle client connections (0 = disabled)
timeout 0

# TCP keepalive
tcp-keepalive 300

# Performance Tuning
# ------------------
# Maximum number of clients
maxclients 1000

# Slow log (log queries slower than N microseconds)
slowlog-log-slower-than 10000
slowlog-max-len 128
